name: WeekCalIOS
options:
  bundleIdPrefix: tk.youteach
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  WeekCalIOS:
    type: application
    platform: iOS
    sources:
      - path: WeekCalIOS
      - path: Shared
    info:
      path: WeekCalIOS/Info.plist
      properties:
        CFBundleDisplayName: WeekCal
        NSCalendarsFullAccessUsageDescription: WeekCal necesita leer tus calendarios para mostrar tu semana y conservar los colores de tus eventos.
        NSCalendarsUsageDescription: WeekCal necesita leer tus calendarios para mostrar tu semana.
    entitlements:
      path: WeekCalIOS/WeekCalIOS.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tk.youteach.weekcal.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - target: WeekCalWidgetExtension

  WeekCalWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: WeekCalWidget
      - path: Shared
    info:
      path: WeekCalWidget/Info.plist
      properties:
        CFBundleDisplayName: WeekCal Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: WeekCalWidget/WeekCalWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tk.youteach.weekcal.ios.widget
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"

schemes:
  WeekCalIOS:
    build:
      targets:
        WeekCalIOS: all
        WeekCalWidgetExtension: all
    run:
      config: Debug
    archive:
      config: Release
