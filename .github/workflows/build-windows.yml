name: Build Windows

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "electron/**"
      - "renderer/**"
      - "native/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/build-windows.yml"

jobs:
  native-validate:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build desktop helper
        run: dotnet publish native/DesktopHost/DesktopHost.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o native/DesktopHost/publish

  js-validate:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test

  package:
    needs:
      - native-validate
      - js-validate
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build desktop helper
        run: dotnet publish native/DesktopHost/DesktopHost.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o native/DesktopHost/publish
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Prepare WeekCal Google OAuth config
        shell: pwsh
        env:
          WEEKCAL_GOOGLE_CLIENT_ID: ${{ vars.WEEKCAL_GOOGLE_CLIENT_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WEEKCAL_GOOGLE_CLIENT_ID)) {
            throw "Missing WEEKCAL_GOOGLE_CLIENT_ID repository variable."
          }
          $config = @{
            client_id = $env:WEEKCAL_GOOGLE_CLIENT_ID
          } | ConvertTo-Json -Compress
          Set-Content -Path "electron/google-app-config.generated.json" -Value $config -Encoding UTF8
      - run: npm run dist:win
      - name: Remove generated OAuth config
        if: always()
        shell: pwsh
        run: Remove-Item "electron/google-app-config.generated.json" -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: WeekCal-Windows-Installer
          path: dist/WeekCal-Widget-*.exe
          if-no-files-found: error
