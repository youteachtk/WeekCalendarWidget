name: Eva Dock - Publicar actualizacion
on:
  push:
    branches: [eva-dock]
    paths:
      - 'eva-dock/**'
      - '.github/workflows/eva-dock-release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Compilar Windows (sin imagenes privadas)
        run: |
          cd eva-dock
          V=$(cat version.txt)
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-H=windowsgui -s -w -X main.version=$V" -o EvaDock.exe .
          sha256sum EvaDock.exe > EvaDock.sha256
      - name: Publicar nueva version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(cat eva-dock/version.txt)
          TAG="eva-dock-v${V}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Ya existe $TAG; no se sobrescribira. Cambia version.txt para publicar una version nueva."
            exit 1
          fi
          gh release create "$TAG" eva-dock/EvaDock.exe eva-dock/EvaDock.sha256 \
             --target "$GITHUB_SHA" --title "Eva Dock $V" \
             --notes "Actualizacion de Eva Dock. Conserva las seis poses privadas instaladas en el equipo."